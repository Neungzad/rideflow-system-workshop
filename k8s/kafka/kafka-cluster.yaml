# KafkaNodePool — combined controller + broker (KRaft mode, dev single-node)
# Strimzi 1.0.0+ dropped ZooKeeper. KRaft is now the only mode.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: rideflow
  labels:
    strimzi.io/cluster: rideflow-kafka
spec:
  replicas: 1 # 3 for production (separate controller + broker pools)
  roles:
    - controller
    - broker
  storage:
    type: ephemeral # persistent for production
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: rideflow-kafka
  namespace: rideflow
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
