apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: order-assigned
  namespace: rideflow
  labels:
    strimzi.io/cluster: rideflow-kafka
spec:
  topicName: order.assigned
  partitions: 6
  replicas: 1 # 3 for production
  config:
    retention.ms: 604800000 # 7 days
    cleanup.policy: delete
